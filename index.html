<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>VR 운전면허 마스터</title>
  <meta name="description" content="VR로 운전면허 장내기능시험을 연습하는 시뮬레이터. 레이싱 페달이나 발에 묶은 VR 컨트롤러로 실제처럼 발로 운전할 수 있습니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- 시작 화면 -->
  <section id="start-screen" class="overlay">
    <div class="start-card">
      <div class="brand">
        <div class="brand-badge">VR</div>
        <div>
          <h1>VR 운전면허 마스터</h1>
          <p class="sub">장내기능시험 완전 정복 · 2026년형 전기차 · 발 페달 지원</p>
        </div>
      </div>

      <div class="start-actions">
        <button id="btn-vr" class="btn primary big" disabled>VR 기기 확인 중…</button>
        <button id="btn-desktop" class="btn big">PC 화면으로 시작</button>
      </div>
      <p id="vr-status" class="hint"></p>

      <div class="mode-pick">
        <span class="label">시작 모드</span>
        <label class="chip"><input type="radio" name="mode" value="practice" checked /> 연습 주행</label>
        <label class="chip"><input type="radio" name="mode" value="exam" /> 장내기능시험</label>
      </div>

      <div class="start-links">
        <button class="link" data-open="help">조작법 보기</button>
        <button class="link" data-open="pedals">발 페달 · 핸들 설정</button>
        <button class="link" data-open="settings">설정</button>
        <button class="link" data-open="rules">채점 기준</button>
      </div>

      <div id="device-line" class="device-line">연결된 페달/핸들: 없음 (키보드 사용)</div>
    </div>
  </section>

  <!-- 주행 중 PC 화면용 HUD -->
  <section id="hud" class="hidden">
    <div class="hud-panel" id="hud-main">
      <div class="hud-top">
        <span id="hud-mode" class="tag">연습</span>
        <span id="hud-section"></span>
        <span id="hud-score" class="score"></span>
      </div>
      <div id="hud-instruction" class="instruction"></div>
      <div id="hud-hint" class="hint-line"></div>
    </div>
    <div class="hud-speed">
      <div><span id="hud-kmh">0</span><small> km/h</small></div>
      <div id="hud-gear" class="gear">P</div>
    </div>
    <div id="toasts"></div>
    <div class="hud-help">Esc 메뉴 · F1 조작법 · V 시점</div>
  </section>

  <!-- 일시정지 메뉴 -->
  <section id="pause-menu" class="overlay hidden">
    <div class="card">
      <h2>메뉴</h2>
      <div class="menu-grid">
        <button class="btn primary" data-action="resume">계속하기</button>
        <button class="btn" data-action="exam">장내기능시험 시작</button>
        <button class="btn" data-action="practice">연습 주행</button>
        <button class="btn" data-open="jump">구간 이동</button>
        <button class="btn" data-open="pedals">발 페달 · 핸들 설정</button>
        <button class="btn" data-open="settings">설정</button>
        <button class="btn" data-open="help">조작법</button>
        <button class="btn" data-open="rules">채점 기준</button>
      </div>
    </div>
  </section>

  <!-- 공용 모달 -->
  <section id="modal" class="overlay hidden">
    <div class="card wide">
      <button class="close" data-action="close-modal" aria-label="닫기">✕</button>
      <div id="modal-body"></div>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
